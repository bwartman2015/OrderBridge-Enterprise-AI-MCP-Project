[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orderbridge"
version = "1.0.0"
description = "AI-enabled supply chain integration hub: EDI, REST, events, and a secure MCP server"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["orderbridge*"]

[tool.setuptools.package-data]
"orderbridge.dashboard" = ["*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
